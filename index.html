<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--ink:#182a3a;--muted:#788797;--line:#e8edf0;--paper:#f6f8f8;--white:#fff;--teal:#168b80;--teal-dark:#0d7169;--mint:#e8f6f2;--gold:#eab55a;--coral:#dc806d;--navy:#18334a;--shadow:0 4px 20px #2038490a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{background:var(--navy);color:#d7e3e8;width:245px;padding:27px 17px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;gap:12px;align-items:center;padding:0 8px 34px}.brand-icon{width:38px;height:38px;border-radius:13px;background:#1b9486;display:grid;place-items:center;color:white;font-size:18px}.brand b{font:700 15px Manrope,sans-serif;color:white}.brand small{display:block;color:#90a7b3;font-size:11px;margin-top:3px}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:#78909e;padding:0 12px;margin:10px 0}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#bac9cf;text-align:left;border-radius:9px;padding:11px 12px;display:flex;gap:11px;align-items:center;font-size:13px}.nav button:hover,.nav button.active{background:#ffffff16;color:white}.nav button.active{box-shadow:inset 3px 0 #54c4ac}.nav .ico{width:18px;text-align:center;font-size:16px}.sidebar-bottom{margin-top:auto;padding:13px 11px;border-top:1px solid #ffffff18;color:#91a7b1;font-size:11px;line-height:1.6}.main{flex:1;min-width:0}.topbar{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px}.crumb{color:var(--muted);font-size:12px}.profile{display:flex;align-items:center;gap:10px;font-weight:600;font-size:12px}.avatar{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:#e9f4f1;color:var(--teal);font-weight:700}.content{max-width:1320px;margin:auto;padding:31px 38px 55px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:23px}.eyebrow{font-size:11px;color:var(--teal);letter-spacing:.9px;text-transform:uppercase;font-weight:700;margin-bottom:7px}.page-head h1{font:800 25px Manrope,sans-serif;margin:0;letter-spacing:-.5px}.page-head p{color:var(--muted);margin:7px 0 0;font-size:13px}.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:9px 14px;border-radius:8px;font-weight:600;font-size:12px;display:inline-flex;gap:8px;align-items:center}.btn:hover{border-color:#b6cbc7}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn.primary:hover{background:var(--teal-dark)}.btn.small{padding:7px 10px;font-size:11px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.metric{background:white;border:1px solid var(--line);border-radius:11px;padding:17px 18px;box-shadow:var(--shadow)}.metric-top{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.metric-icon{width:29px;height:29px;border-radius:9px;background:var(--mint);color:var(--teal);display:grid;place-items:center;font-size:15px}.metric strong{display:block;font:800 25px Manrope,sans-serif;margin:12px 0 3px}.metric-foot{color:#87939e;font-size:11px}.panel{background:white;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);margin-bottom:17px}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}.panel-head h2{font:700 14px Manrope;margin:0}.panel-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.filters{display:flex;gap:8px}.field-search{position:relative}.field-search input{padding-left:32px;width:225px}.field-search span{position:absolute;left:11px;top:8px;color:#91a0aa}.control,input,select{border:1px solid #e2e9eb;background:white;border-radius:7px;padding:8px 10px;color:var(--ink);outline:none;font-size:12px}.control:focus,input:focus,select:focus{border-color:#5caea2;box-shadow:0 0 0 3px #168b8012}table{border-collapse:collapse;width:100%;white-space:nowrap}th{background:#fafbfb;color:#84919d;text-transform:uppercase;letter-spacing:.55px;font-size:9px;font-weight:700;text-align:left;padding:11px 15px}td{padding:12px 15px;border-top:1px solid #eff2f3;font-size:12px}tbody tr:hover{background:#fbfdfc}.person{display:flex;align-items:center;gap:10px}.initial{width:31px;height:31px;border-radius:10px;background:#eaf4f2;color:#287f76;display:grid;place-items:center;font-size:11px;font-weight:700}.person b{font-size:12px}.person small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.tag{display:inline-flex;align-items:center;border-radius:20px;padding:5px 9px;font-size:10px;font-weight:600;background:#f1f4f5;color:#687987}.tag.paid{background:#e8f6f0;color:#278168}.tag.transfer{background:#edf3fb;color:#5278a4}.tag.cash{background:#fff4df;color:#a67a2a}.tag.wait{background:#fff3ec;color:#c57853}.tabs{display:flex;gap:4px;padding:0 19px;border-bottom:1px solid var(--line);overflow:auto}.tab{padding:13px 13px 12px;border:0;border-bottom:2px solid transparent;background:transparent;color:#748390;font-size:12px;white-space:nowrap}.tab.active{border-color:var(--teal);color:var(--teal);font-weight:700}.table-wrap{overflow:auto}.empty{padding:45px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);margin:0 0 6px}.layout{display:grid;grid-template-columns:1fr 310px;gap:17px}.aside-card{padding:20px}.aside-card h3{font:700 13px Manrope;margin:0 0 16px}.step{display:flex;gap:12px;margin:0 0 18px}.stepnum{flex:none;width:24px;height:24px;border-radius:8px;background:var(--mint);display:grid;place-items:center;color:var(--teal);font-size:11px;font-weight:700}.step b{display:block;font-size:12px;margin:2px 0 4px}.step p{color:var(--muted);font-size:11px;line-height:1.5;margin:0}.notice{background:#f2f8f7;border:1px solid #dbeee9;padding:12px;border-radius:8px;color:#50746e;font-size:11px;line-height:1.5}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:#10273770;display:grid;place-items:center;padding:15px;z-index:5}.modal{width:min(600px,100%);max-height:92vh;overflow:auto;background:white;border-radius:14px;box-shadow:0 20px 70px #142b3b40}.modal-head{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-head h2{margin:0;font:700 16px Manrope}.close{border:0;background:transparent;font-size:20px;color:#84919d}.modal-body{padding:20px 23px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-group label{display:block;color:#6c7c89;font-size:11px;margin-bottom:6px;font-weight:600}.form-group input,.form-group select{width:100%;padding:10px}.form-group.full{grid-column:1/-1}.modal-foot{padding:14px 23px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.pill{font-size:10px;color:#778792}.toast{position:fixed;bottom:22px;right:24px;background:#183d45;color:white;padding:12px 17px;border-radius:9px;box-shadow:0 6px 25px #0002;font-size:12px;z-index:10}.mobile-menu{display:none}
@media(max-width:900px){.sidebar{width:205px}.content{padding:25px 22px}.topbar{padding:0 22px}.metrics{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.layout>.panel~.panel{display:none}}
@media(max-width:650px){.sidebar{width:60px;padding:18px 8px}.brand{padding:0 3px 25px}.brand b,.brand small,.nav-label,.nav button span:not(.ico),.sidebar-bottom{display:none}.nav button{justify-content:center;padding:12px 5px}.main{min-width:0}.topbar{height:58px;padding:0 15px}.content{padding:22px 13px}.page-head{gap:12px;flex-direction:column}.page-head h1{font-size:22px}.metrics{gap:9px}.metric{padding:13px}.metric strong{font-size:21px}.panel-head{padding:15px;align-items:flex-start;gap:10px;flex-direction:column}.filters{width:100%}.field-search{flex:1}.field-search input{width:100%}.filters select{max-width:130px}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}.actions{width:100%}.actions .btn{flex:1;justify-content:center}}
</style><style>:root{--ink:#302326;--muted:#827579;--line:#eee5e6;--paper:#fffafa;--white:#fff;--teal:#c62832;--teal-dark:#a51e27;--mint:#fff0f1;--navy:#a51e27;--shadow:0 4px 20px #67252b0a}.sidebar{color:#fff0f1}.brand-icon{width:52px;height:52px;border-radius:9px;background:#fff;overflow:hidden;flex:none}.brand-icon img{width:100%;height:100%;object-fit:contain}.brand b{font-size:13px;line-height:1.3}.brand small{color:#ffdfe1}.nav-label{color:#f0b8bc}.nav button{color:#f9dfe1}.nav button.active{box-shadow:inset 3px 0 #fff}.avatar{background:var(--mint)}.btn:hover{border-color:#e0b4b7}.control:focus,input:focus,select:focus{border-color:#d06a71;box-shadow:0 0 0 3px #c6283212}.initial{background:#fff0f1;color:#b51f28}.tag.paid{background:#fff0f1;color:#b51f28}.tag.transfer{background:#fff3f3;color:#a51e27}.tag.cash{background:#fff7f7;color:#a94349}.notice{background:#fff7f7;border-color:#f3dfe1;color:#79575b}.toast{background:#8d1d24}</style></head>
<body><section id="authGate" style="display:none;min-height:100vh;place-items:center;padding:20px;background:#fffafa"><form id="loginForm" style="width:min(420px,100%);background:white;padding:32px;border:1px solid #eee5e6;border-radius:14px;box-shadow:0 8px 30px #67252b0a"><div class="brand-icon" style="margin-bottom:20px"><img src="logo-saigon-connection.png" alt=""></div><div class="eyebrow">Saigon Connection Center</div><h1 style="font:800 23px Manrope;margin:0 0 8px">Đăng nhập</h1><p style="color:#827579;font-size:13px;margin:0 0 22px">Dành cho chủ trung tâm và kế toán.</p><label style="display:block;font-size:12px;margin-bottom:6px">Email</label><input type="email" name="email" required autocomplete="username" style="width:100%;margin-bottom:14px"><label style="display:block;font-size:12px;margin-bottom:6px">Mật khẩu</label><input type="password" name="password" required autocomplete="current-password" style="width:100%;margin-bottom:18px"><button class="btn primary" style="width:100%;justify-content:center">Đăng nhập</button><button type="button" id="signupButton" class="btn" style="width:100%;justify-content:center;margin-top:9px">Tạo tài khoản</button><p style="color:#827579;font-size:11px;line-height:1.5">Chỉ email đã được trung tâm cho phép mới đăng ký được.</p><p id="authMessage" style="color:#a51e27;font-size:12px;line-height:1.5"></p></form></section><div class="app" id="mainApp" style="display:none"><aside class="sidebar"><div class="brand"><div class="brand-icon"><img src="logo-saigon-connection.png" alt="Logo Saigon Connection Center"></div><div><b>Saigon Connection<br>Center</b><small>ENGLISH CENTER</small></div></div><div class="nav-label">Tổng quan</div><nav class="nav"><button data-page="dashboard" class="active"><span class="ico">▦</span><span>Tổng quan</span></button><button data-page="students"><span class="ico">♙</span><span>Danh sách học sinh</span></button><button data-page="tuition"><span class="ico">▤</span><span>Thu học phí</span></button><button data-page="tax"><span class="ico">◉</span><span>Sổ theo dõi thuế</span></button></nav><div class="sidebar-bottom">Dữ liệu được đồng bộ an toàn qua Supabase.</div></aside><main class="main"><header class="topbar"><div class="crumb">Saigon Connection / <b id="crumb">Tổng quan</b></div><div class="profile"><div class="avatar">SC</div><span id="userLabel">Tài khoản</span><button class="btn small" onclick="signOut()">Đăng xuất</button></div></header><div class="content" id="appContent"></div></main></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
let db={students:[],payments:{},bankImports:{},purchases:{}};let supabaseClient=null,currentUser=null;let page='dashboard',monthKey=new Date().toISOString().slice(0,7),subtab='all',tuitionSection='tuition',search='',selectedStudents=new Set();const $=s=>document.querySelector(s),fmtDate=s=>s?new Date(s+'T00:00:00').toLocaleDateString('vi-VN'):'—',esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=async()=>{if(!supabaseClient||!currentUser)return;const {error}=await supabaseClient.from('center_data').upsert({id:'main',data:db,updated_by:currentUser.id},{onConflict:'id'});if(error){console.error(error);toast('Không đồng bộ được dữ liệu: '+error.message)}};const monLabel=k=>{let[y,m]=k.split('-');return `Tháng ${+m}/${y}`};const records=()=>db.payments[monthKey]||[];const initials=n=>String(n||'?').trim().split(/\s+/).slice(-2).map(x=>x[0]).join('').toUpperCase();
function normName(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ')}
function guardians(){return db.students.flatMap(s=>[{name:s.father,phone:s.fatherPhone,student:s},{name:s.mother,phone:s.motherPhone,student:s}]).filter(x=>x.name)}
function monthTabs(){let label=tuitionSection==='shirt'?'Mua áo':tuitionSection==='book'?'Mua sách':'Học phí';return [...new Set([new Date().toISOString().slice(0,7),...Object.keys(db.payments),...Object.keys(db.bankImports||{}),...Object.keys(db.purchases||{})])].sort().map(m=>`<button class="tab ${m===monthKey?'active':''}" onclick="setMonth('${m}')">${label} ${monLabel(m)}</button>`).join('')}
function setMonth(m){monthKey=m;render()}
function money(x){return Number(x||0).toLocaleString('vi-VN')+' ₫'}
function nav(p){page=p;search='';document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));$('#crumb').textContent={dashboard:'Tổng quan',students:'Danh sách học sinh',tuition:'Thu học phí',tax:'Sổ theo dõi thuế'}[p];render()}
document.querySelectorAll('.nav button').forEach(x=>x.onclick=()=>nav(x.dataset.page));
function render(){let root=$('#appContent');if(page==='dashboard')root.innerHTML=dashboard();if(page==='students')root.innerHTML=studentsPage();if(page==='tuition')root.innerHTML=tuitionPage();if(page==='tax')root.innerHTML=taxPage();bind()}
function dashboard(){let rr=records(),paid=rr.length,trans=rr.filter(x=>x.method==='transfer').length,cash=rr.filter(x=>x.method==='cash').length,total=rr.reduce((n,x)=>n+Number(x.amount||0),0);return `<div class="page-head"><div><div class="eyebrow">Xin chào, quản trị viên</div><h1>Tổng quan học phí</h1><p>Theo dõi tình hình thu học phí của trung tâm trong ${monLabel(monthKey).toLowerCase()}.</p></div><div class="actions"><input type="month" class="control" aria-label="Chọn tháng tổng quan" value="${monthKey}" onchange="setMonth(this.value)"><button class="btn" onclick="nav('students')">♙ &nbsp;Danh sách học sinh</button><button class="btn primary" onclick="nav('tuition')">＋ &nbsp;Ghi nhận học phí</button></div></div><div class="metrics"><div class="metric"><div class="metric-top">Đã thu tháng này <span class="metric-icon">₫</span></div><strong style="font-size:21px">${money(total)}</strong><div class="metric-foot">${paid} khoản thu đã ghi nhận</div></div><div class="metric"><div class="metric-top">Đã đóng tháng này <span class="metric-icon">✓</span></div><strong>${paid}</strong><div class="metric-foot">${db.students.length?Math.round(paid/db.students.length*100):0}% tổng số học sinh</div></div><div class="metric"><div class="metric-top">Chuyển khoản <span class="metric-icon">↗</span></div><strong>${trans}</strong><div class="metric-foot">Giao dịch tháng ${+monthKey.slice(5)}</div></div><div class="metric"><div class="metric-top">Tiền mặt <span class="metric-icon">◉</span></div><strong>${cash}</strong><div class="metric-foot">Giao dịch tháng ${+monthKey.slice(5)}</div></div></div><div class="layout"><section class="panel"><div class="panel-head"><div><h2>Thu học phí gần đây</h2><p>${monLabel(monthKey)} · ${paid} học sinh đã đóng</p></div><button class="btn small" onclick="nav('tuition')">Xem tháng này →</button></div>${paymentTable(rr.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6),false)}</section><aside class="panel aside-card"><h3>Bắt đầu quản lý</h3><div class="step"><span class="stepnum">1</span><div><b>Thêm danh sách học sinh</b><p>Lưu lớp học và thông tin liên hệ của phụ huynh.</p></div></div><div class="step"><span class="stepnum">2</span><div><b>Ghi nhận khoản thu</b><p>Tìm học sinh hoặc phụ huynh, chọn cách đóng và ngày nhận.</p></div></div><div class="step"><span class="stepnum">3</span><div><b>Xem báo cáo tự động</b><p>Danh sách được chia thành đã đóng, chuyển khoản, tiền mặt và thuế.</p></div></div><button class="btn small" onclick="backupJSON()">↓ &nbsp;Sao lưu toàn bộ dữ liệu (JSON)</button></aside></div>`}
function studentsPage(){let list=db.students.filter(s=>[s.name,s.className,s.phone,s.father,s.mother].join(' ').toLowerCase().includes(search.toLowerCase()));return `<div class="page-head"><div><div class="eyebrow">Hồ sơ trung tâm</div><h1>Danh sách học sinh</h1><p>Nhập hồ sơ và mức học phí tháng; tick học sinh để ghi nhận khoản thu.</p></div><div class="actions"><button class="btn" onclick="studentTemplate()">↓ &nbsp;Tải mẫu</button><label class="btn">↑ &nbsp;Nhập Excel<input type="file" accept=".xlsx,.xls,.csv" hidden onchange="importStudents(this)"></label><button class="btn" onclick="exportCSV('students')">↓ &nbsp;Xuất CSV</button><button class="btn primary" onclick="studentModal()">＋ &nbsp;Thêm học sinh</button></div></div><section class="panel"><div class="panel-head"><div><h2>Học sinh <span class="pill">${list.length} hồ sơ</span></h2><p>Học phí mặc định được điền tự động khi ghi nhận đã đóng.</p></div><div class="filters"><div class="field-search"><span>⌕</span><input id="search" placeholder="Tìm học sinh / phụ huynh..." value="${esc(search)}"></div></div></div><div class="tabs" style="align-items:center;gap:9px;padding:11px 19px;flex-wrap:wrap"><label style="font-size:11px;color:#647785"><input type="checkbox" onchange="toggleVisible(this)"> Chọn tất cả đang hiển thị</label><input type="month" class="control" id="bulkMonth" value="${monthKey}"><input type="date" class="control" id="bulkDate" value="${new Date().toISOString().slice(0,10)}"><select class="control" id="bulkMethod"><option value="transfer">Chuyển khoản</option><option value="cash">Tiền mặt</option></select><button class="btn primary small" onclick="recordSelected()">✓ Ghi nhận đã đóng (${selectedStudents.size})</button></div>${list.length?`<div class="table-wrap"><table><thead><tr><th></th><th>Học sinh</th><th>Lớp</th><th>Điện thoại</th><th>Học phí/tháng</th><th>Phụ huynh</th><th>Ngày sinh</th><th></th></tr></thead><tbody>${list.map(s=>`<tr><td><input type="checkbox" ${selectedStudents.has(s.id)?'checked':''} onchange="selectStudent('${s.id}',this.checked)"></td><td><div class="person"><span class="initial">${initials(s.name)}</span><div><b>${esc(s.name)}</b><small>${s.gender||'Học sinh'}</small></div></div></td><td><span class="tag">${esc(s.className||'Chưa xếp lớp')}</span></td><td>${esc(s.phone||'—')}</td><td><b>${s.tuitionFee?money(s.tuitionFee):'—'}</b></td><td>${esc([s.father,s.mother].filter(Boolean).join(' · ')||'—')}</td><td>${fmtDate(s.dob)}</td><td><button class="btn small" onclick="studentModal('${s.id}')">Sửa</button> <button class="btn small" onclick="deleteStudent('${s.id}')">Xóa</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>${search?'Không tìm thấy học sinh':'Chưa có hồ sơ học sinh'}</b>${search?'Thử từ khóa khác.':'Thêm hồ sơ hoặc nhập bảng Excel để bắt đầu.'}</div>`}</section>`}

function toggleVisible(el){document.querySelectorAll('tbody input[type=checkbox][onchange]').forEach(c=>{let m=c.getAttribute('onchange').match(/selectStudent\('([^']+)'/);if(m){c.checked=el.checked;selectStudent(m[1],el.checked)}});render()}
function recordSelected(){let month=$('#bulkMonth')?.value||monthKey,date=$('#bulkDate')?.value||'',method=$('#bulkMethod')?.value||'transfer';if(!selectedStudents.size){toast('Tick ít nhất một học sinh trước');return}if(!date||date.slice(0,7)!==month){toast('Ngày đóng cần nằm trong tháng đã chọn');return}db.payments[month]??=[];let added=0;for(let id of selectedStudents){let s=db.students.find(x=>x.id===id);if(!s||db.payments[month].some(r=>r.studentId===id))continue;db.payments[month].push({id:crypto.randomUUID(),studentId:id,studentName:s.name,studentPhone:s.phone,className:s.className,payer:'',date,month,method,account:'center',centerParent:false,amount:s.tuitionFee||'',note:''});added++}save();monthKey=month;selectedStudents.clear();page='tuition';tuitionSection='tuition';$('#crumb').textContent='Thu học phí';render();toast(added?`Đã ghi nhận ${added} học sinh`:'Các học sinh đã có khoản thu trong tháng này')}
function readSheet(file,done){let reader=new FileReader();reader.onload=e=>{try{let rows;if(file.name.toLowerCase().endsWith('.csv')){let text=e.target.result;rows=text.split(/\r?\n/).filter(Boolean).map(line=>line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x=>x.replace(/^"|"$/g,'').replace(/""/g,'"')))}else{if(!window.XLSX)throw Error('Không tải được bộ đọc Excel. Kết nối Internet hoặc lưu file dưới dạng CSV rồi thử lại.');let wb=XLSX.read(e.target.result,{type:'array',cellDates:true});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}done(rows)}catch(err){toast(err.message||'Không đọc được file')}};if(file.name.toLowerCase().endsWith('.csv'))reader.readAsText(file,'UTF-8');else reader.readAsArrayBuffer(file)}
function importStudents(input){let f=input.files[0];if(!f)return;readSheet(f,rows=>{if(!rows.length)return;let headers=rows[0].map(normName),keys={name:['ho ten hoc sinh','ho va ten hoc sinh','ho ten','ten hoc sinh','student name','name'],phone:['so dien thoai hoc sinh','dien thoai hoc sinh','sdt hoc sinh','student phone'],className:['lop','ten lop','class','class name'],tuitionFee:['hoc phi','hoc phi thang','tien hoc phi','muc hoc phi','monthly fee','tuition fee','tuition amount'],father:['ho ten bo','ten bo','father name'],fatherPhone:['so dien thoai bo','sdt bo','father phone'],mother:['ho ten me','ten me','mother name'],motherPhone:['so dien thoai me','sdt me','mother phone'],dob:['ngay sinh','ngay thang nam sinh','date of birth','dob']};let idx={};for(let [k,aliases] of Object.entries(keys))idx[k]=headers.findIndex(h=>aliases.includes(h));let start=idx.name>=0?1:0;if(idx.name<0)idx.name=0;let count=0;for(let row of rows.slice(start)){let get=k=>idx[k]>=0?String(row[idx[k]]||'').trim():'';let name=get('name');if(!name)continue;let student={id:crypto.randomUUID(),name,phone:get('phone'),className:get('className'),tuitionFee:get('tuitionFee').replace(/\D/g,''),father:get('father'),fatherPhone:get('fatherPhone'),mother:get('mother'),motherPhone:get('motherPhone'),dob:excelDate(idx.dob>=0?row[idx.dob]:'')};let dup=db.students.some(s=>normName(s.name)===normName(name)&&s.className===student.className);if(!dup){db.students.push(student);count++}}save();render();toast(`Đã nhập ${count} học sinh${count?'':' (bỏ qua dòng trùng)'}`)});input.value=''}
function excelDate(v){if(!v)return '';if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);let s=String(v).trim();if(/^\d{4}-\d\d-\d\d$/.test(s))return s;let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:''}
function importBank(input){let f=input.files[0];if(!f)return;let month=$('#taxMonth')?.value||monthKey;readSheet(f,rows=>{if(!rows.length)return;let hs=rows[0].map(normName),find=terms=>hs.findIndex(h=>terms.some(t=>h.includes(normName(t)))),ni=find(['ten chu tai khoan','ten nguoi chuyen','ten nguoi gui','ten tai khoan','account name','sender name','name']),di=find(['ngay giao dich','ngay chuyen','ngay','date']),ai=find(['so tien','amount','credit']);let start=ni>=0?1:0;if(ni<0)ni=0;let result=[];for(let row of rows.slice(start)){let owner=String(row[ni]||'').trim();if(!owner)continue;let date=di>=0?excelDate(row[di]):'';let amount=ai>=0?String(row[ai]||'').replace(/[^\d.-]/g,''):'';result.push({id:crypto.randomUUID(),owner,date,amount})}db.bankImports[month]=result;let matched=new Set(guardians().filter(g=>result.some(r=>normName(r.owner)===normName(g.name))).map(g=>normName(g.name)));for(let rs of Object.values(db.payments))for(let r of rs)if(r.method==='transfer'&&r.payer&&matched.has(normName(r.payer)))r.centerParent=true;save();render();toast(`Đã nhập ${result.length} giao dịch; so khớp tên không phân biệt dấu`)});input.value=''}
function downloadTemplate(){download('mau-doi-soat-ngan-hang.csv',csv([['Tên chủ tài khoản','Ngày giao dịch','Số tiền'],['NGUYEN THI HOA','01/12/2026','1500000']]))}function studentTemplate(){download('mau-danh-sach-hoc-sinh.csv',csv([['Họ tên học sinh','Số điện thoại học sinh','Lớp','Học phí/tháng','Họ tên bố','Số điện thoại bố','Họ tên mẹ','Số điện thoại mẹ','Ngày sinh']]))}
function csv(rows){return '\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}function download(name,content,type='text/csv;charset=utf-8'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}function backupJSON(){download('brightpath-sao-luu.json',JSON.stringify(db,null,2),'application/json');toast('Đã tải bản sao dữ liệu')}function exportCSV(kind){let rows,filename;if(kind==='students'){rows=[['Họ tên','Điện thoại HS','Lớp','Học phí/tháng','Họ tên bố','Điện thoại bố','Họ tên mẹ','Điện thoại mẹ','Ngày sinh'],...db.students.map(s=>[s.name,s.phone,s.className,s.tuitionFee,s.father,s.fatherPhone,s.mother,s.motherPhone,s.dob])];filename='danh-sach-hoc-sinh.csv'}else if(kind==='tax'){rows=[['Tháng','Tên chủ tài khoản','Phụ huynh khớp','Học sinh','Ngày giao dịch','Số tiền','Kết quả']];for(let [m,rs] of Object.entries(db.bankImports||{}))for(let r of rs){let g=guardians().filter(x=>normName(x.name)===normName(r.owner));rows.push([m,r.owner,g.map(x=>x.name).join(' / '),g.map(x=>x.student.name).join(' / '),r.date,r.amount,g.length?'Đã khớp phụ huynh':'Chưa khớp'])}filename='so-theo-doi-thue.csv'}else if(kind==='purchases'){let label=tuitionSection==='shirt'?'áo':'sách',rs=(db.purchases[monthKey]||[]).filter(x=>x.kind===tuitionSection);rows=[['Tháng','Người mua','Chi tiết','Ngày','Số tiền','Ghi chú'],...rs.map(r=>[monthKey,r.buyer,r.item,r.date,r.amount,r.note])];filename=`mua-${tuitionSection==='shirt'?'ao':'sach'}-${monthKey}.csv`}else{rows=[['Tháng','Học sinh','Lớp','Người đóng','Ngày nhận','Hình thức','Phụ huynh trung tâm','Tài khoản nhận','Số tiền','Ghi chú'],...records().map(r=>[monthKey,r.studentName,r.className,r.payer,r.date,r.method==='transfer'?'Chuyển khoản':'Tiền mặt',r.centerParent?'Có':'Không',r.account==='center'?'Trung tâm':'Khác',r.amount,r.note])];filename=`hoc-phi-${monthKey}.csv`}download(filename,csv(rows));toast('Đã tải xuống tệp CSV')}
async function initializeApp(){const cfg=window.APP_CONFIG||{};if(!cfg.supabaseUrl||!cfg.supabaseAnonKey||!window.supabase){showAuthError('Ứng dụng chưa được cấu hình Supabase. Hãy đặt SUPABASE_URL và SUPABASE_ANON_KEY trên máy chủ.');document.querySelector('#loginForm button').disabled=true;return}supabaseClient=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.currentTarget),{error}=await supabaseClient.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)document.querySelector('#authMessage').textContent='Không đăng nhập được. Kiểm tra email, mật khẩu và quyền tài khoản.'});document.querySelector('#signupButton').addEventListener('click',async()=>{const form=document.querySelector('#loginForm');if(!form.reportValidity())return;const values=new FormData(form),email=String(values.get('email')||'').trim().toLowerCase(),password=String(values.get('password')||''),message=document.querySelector('#authMessage');message.textContent='';const {data,error}=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:window.location.origin}});if(error){message.textContent='Không tạo được tài khoản. Email có thể chưa được cấp quyền hoặc thông tin chưa hợp lệ.';return}message.textContent=data.session?'Tài khoản đã được tạo.':'Đã gửi email xác minh. Mở thư để xác nhận tài khoản, rồi đăng nhập.'
});supabaseClient.auth.onAuthStateChange((_event,session)=>{if(session)activateSession(session).catch(e=>showAuthError(e.message));else{currentUser=null;document.querySelector('#mainApp').style.display='none';document.querySelector('#authGate').style.display='grid'}});const {data:{session}}=await supabaseClient.auth.getSession();if(session)await activateSession(session);else document.querySelector('#authGate').style.display='grid'}
async function activateSession(session){let role=session.user.app_metadata?.role;if(!['owner','accountant'].includes(role)){await supabaseClient.auth.signOut();showAuthError('Tài khoản chưa được cấp quyền. Quản trị viên cần gán role owner hoặc accountant trong Supabase Auth.');return}currentUser=session.user;document.querySelector('#authGate').style.display='none';document.querySelector('#mainApp').style.display='flex';document.querySelector('#userLabel').textContent=(session.user.user_metadata?.name||session.user.email)+(role==='accountant'?' · Kế toán':' · Chủ trung tâm');const {data,error}=await supabaseClient.from('center_data').select('data').eq('id','main').maybeSingle();if(error)throw error;db=data?.data||{students:[],payments:{},bankImports:{}};db.students??=[];db.payments??={};db.bankImports??={};db.purchases??={};render();supabaseClient.removeChannel(window.dataChannel);window.dataChannel=supabaseClient.channel('center-data-sync').on('postgres_changes',{event:'*',schema:'public',table:'center_data',filter:'id=eq.main'},payload=>{if(payload.new?.updated_by!==currentUser.id&&payload.new?.data){db=payload.new.data;render();toast('Đã cập nhật dữ liệu từ tài khoản khác')}}).subscribe()}
function showAuthError(message){document.querySelector('#authGate').style.display='grid';document.querySelector('#authMessage').textContent=message}
async function signOut(){await supabaseClient.auth.signOut()}
initializeApp();
</script></body></html>
